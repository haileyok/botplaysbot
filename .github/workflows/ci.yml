name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: playsbot
          POSTGRES_USER: playsbot
          POSTGRES_PASSWORD: playsbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playsbot -d playsbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm version comes from package.json's packageManager field
      # (pnpm@9.15.9); do not pin it here — action-setup@v4 reads it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CI (codegen-check, build, typecheck, lint, test)
        run: make ci
        env:
          DATABASE_URL: postgres://playsbot:playsbot@localhost:5432/playsbot?sslmode=disable
